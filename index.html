<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>document</title>
    <style>
        /* Wordpressテーマ「Lightning」に沿ったレスポンシブ設定 */
        .container {
            margin: 20px auto;
            padding-left: 15px;
            padding-right: 15px;
            box-sizing: border-box;
        }

        @media (max-width: 575px) {

            /* containerサイズ100% */
            .container {
                width: 100%;
            }
        }

        @media (min-width: 576px) {

            /* containerサイズ690px */
            .container {
                width: 510px;
            }
        }

        @media (min-width: 768px) {

            /* containerサイズ690px */
            .container {
                width: 690px;
            }
        }

        @media (min-width: 993px) {

            /* containerサイズ960px(サイドバー有：610px） */
            .container {
                width: 960px;
            }
        }

        @media (min-width: 1201px) {

            /* containerサイズ1140px(サイドバー有：730px） */
            .container {
                width: 1140px;
            }
        }
    </style>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <div class="container">

    </div>
</body>

</html>
